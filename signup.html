<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Auth - Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-black flex items-center h-screen justify-center">
    <div class="w-[90%] text-white py-10 px-5 max-w-[500px] border-1 border-gray-800">
        <div class="text-center mb-5">
            <p class="text-2xl font-bold">Sign Up</p>
            <p class="text-sm text-gray-600">sign up made with easy auth</p>
        </div>
        <form class="flex flex-col">
            <p class="text-sm text-gray-600">Name</p>
            <input type="text" class="border-1 border-gray-600 w-full my-2 rounded-sm py-1 px-2 outline-none">
            <p class="text-sm text-gray-600">Email</p>
            <input type="email" class="border-1 border-gray-600 w-full my-2 rounded-sm py-1 px-2 outline-none">
            <p class="text-sm text-gray-600">Password</p>
            <input type="password" class="border-1 border-gray-600 w-full my-2 rounded-sm py-1 px-2 outline-none">
            <button class="px-4 py-2 mt-5 rounded-md self-center bg-white text-black" type="submit">Sign Up</button>
            <a href="/login.html" class="mt-2 self-center text-gray-600 text-sm">Log In instead</a>
        </form>
    </div>   
    <script src="signup.js"></script>
</body>
</html>
